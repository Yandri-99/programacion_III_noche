<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestor de Vehículos - Concesionario</title>
</head>
<body>

  <h1>Gestor de Vehículos</h1>

  <form id="formulario">
    <input type="text" id="nombre" placeholder="Nombre del vehículo" required>
    <input type="text" id="descripcion" placeholder="Descripción" required>
    <input type="number" id="precio" placeholder="Precio" required>
    <input type="text" id="ubicacion" placeholder="Ubicación" required>
    <button type="submit">Agregar Vehículo</button>
  </form>

  <section id="contenedorVehiculos"></section>

  <script src="08_vehiculos_mp.js"></script>
</body>
</html>
